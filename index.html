    case "polygon":
      return s.points.map((p, i) => ({ key: i, p }));
    case "text":
      return [{ key: "pos", p: s.pos, kind: "circle" }];
    case "dimension":
      return [
        { key: "p1", p: s.p1 },
        { key: "p2", p: s.p2 },
        { key: "offset", p: dimLabelPos(s), kind: "circle" },
      ];
    default:
      return [];
  }
}

function DimensionShape({ s, unit, scale, interactiveProps }) {
  const sw = 1 / scale;
  const label = dimLabel(s, unit);
  const labelPos = dimLabelPos(s);

  if (s.kind === "angulo") {
    const r = 26;
    const a1 = angleOf(s.p1, s.p2);
    const a2 = angleOf(s.p1, s.p3);
    return (
      <g stroke={s.color} fill={s.color} {...interactiveProps}>
        <line x1={s.p1.x} y1={s.p1.y} x2={s.p2.x} y2={s.p2.y} strokeWidth={sw} strokeDasharray={`${2 / scale},${2 / scale}`} />
        <line x1={s.p1.x} y1={s.p1.y} x2={s.p3.x} y2={s.p3.y} strokeWidth={sw} strokeDasharray={`${2 / scale},${2 / scale}`} />
        <path d={arcPath(s.p1, r, a1, a2)} fill="none" strokeWidth={sw} />
        <text x={labelPos.x} y={labelPos.y} fontSize={12 / scale} fontFamily="'IBM Plex Mono',monospace" stroke="none">
          {label}
        </text>
      </g>
    );
  }

  if (s.kind === "horizontal" || s.kind === "vertical") {
    const isH = s.kind === "horizontal";
    const dimLine = isH ? Math.min(s.p1.y, s.p2.y) + s.offset : Math.max(s.p1.x, s.p2.x) + s.offset;
    const a = isH ? { x: s.p1.x, y: dimLine } : { x: dimLine, y: s.p1.y };
    const b = isH ? { x: s.p2.x, y: dimLine } : { x: dimLine, y: s.p2.y };
    const dirDeg = angleOf(a, b);
    const m = mid(a, b);
    const fontSize = 12 / scale;
    const tickLen = 6 / scale;
    const dLen = dist(a, b) || 1;
    const ux = (b.x - a.x) / dLen,
      uy = (b.y - a.y) / dLen;
    const gap = Math.max(label.length * fontSize * 0.3, fontSize * 0.6) + 2 / scale;
    const gA = { x: m.x - ux * gap, y: m.y - uy * gap };
    const gB = { x: m.x + ux * gap, y: m.y + uy * gap };
    const tA = tickAt(a, dirDeg, tickLen);
    const tB = tickAt(b, dirDeg, tickLen);
    return (
      <g stroke={s.color} fill={s.color} {...interactiveProps}>
        <line x1={s.p1.x} y1={s.p1.y} x2={a.x} y2={a.y} strokeWidth={sw} />
        <line x1={s.p2.x} y1={s.p2.y} x2={b.x} y2={b.y} strokeWidth={sw} />
        <line x1={a.x} y1={a.y} x2={gA.x} y2={gA.y} strokeWidth={sw * 1.4} />
        <line x1={gB.x} y1={gB.y} x2={b.x} y2={b.y} strokeWidth={sw * 1.4} />
        <line x1={tA.x1} y1={tA.y1} x2={tA.x2} y2={tA.y2} strokeWidth={sw * 1.8} />
        <line x1={tB.x1} y1={tB.y1} x2={tB.x2} y2={tB.y2} strokeWidth={sw * 1.8} />
        <text x={m.x} y={m.y} dominantBaseline="middle" fontSize={fontSize} textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" stroke="none">
          {label}
        </text>
      </g>
    );
  }

  // diagonal / diametro / radio
  const a = s.p1,
    b = s.p2;
  const dx = b.x - a.x,
    dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len,
    ny = dx / len;
  const off = s.offset;
  const a2 = { x: a.x + nx * off, y: a.y + ny * off };
  const b2 = { x: b.x + nx * off, y: b.y + ny * off };
  const dirDeg2 = angleOf(a2, b2);
  const m2 = mid(a2, b2);
  const fontSize2 = 12 / scale;
  const tickLen2 = 6 / scale;
  const dLen2 = dist(a2, b2) || 1;
  const ux2 = (b2.x - a2.x) / dLen2,
    uy2 = (b2.y - a2.y) / dLen2;
  const gap2 = Math.max(label.length * fontSize2 * 0.3, fontSize2 * 0.6) + 2 / scale;
  const gA2 = { x: m2.x - ux2 * gap2, y: m2.y - uy2 * gap2 };
  const gB2 = { x: m2.x + ux2 * gap2, y: m2.y + uy2 * gap2 };
  const tA2 = tickAt(a2, dirDeg2, tickLen2);
  const tB2 = tickAt(b2, dirDeg2, tickLen2);
  return (
    <g stroke={s.color} fill={s.color} {...interactiveProps}>
      <line x1={a.x} y1={a.y} x2={a2.x} y2={a2.y} strokeWidth={sw} />
      <line x1={b.x} y1={b.y} x2={b2.x} y2={b2.y} strokeWidth={sw} />
      <line x1={a2.x} y1={a2.y} x2={gA2.x} y2={gA2.y} strokeWidth={sw * 1.4} />
      <line x1={gB2.x} y1={gB2.y} x2={b2.x} y2={b2.y} strokeWidth={sw * 1.4} />
      <line x1={tA2.x1} y1={tA2.y1} x2={tA2.x2} y2={tA2.y2} strokeWidth={sw * 1.8} />
      <line x1={tB2.x1} y1={tB2.y1} x2={tB2.x2} y2={tB2.y2} strokeWidth={sw * 1.8} />
      <text x={m2.x} y={m2.y} dominantBaseline="middle" fontSize={fontSize2} textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" stroke="none">
        {label}
      </text>
    </g>
  );
}

function WeldSymbolShape({ s, scale, interactiveProps }) {
  const sw = 1.4 / scale;
  const g = weldGeom(s);
  const fontSize = 11 / scale;
  return (
    <g stroke={s.color} fill="none" {...interactiveProps}>
      <line x1={g.leader.x1} y1={g.leader.y1} x2={g.leader.x2} y2={g.leader.y2} strokeWidth={sw} markerEnd="url(#arrowend)" />
      <line x1={g.ref.x1} y1={g.ref.y1} x2={g.ref.x2} y2={g.ref.y2} strokeWidth={sw} />
      {g.glyphs.map((gl, i) => {
        if (gl.kind === "polygon") return <polygon key={i} points={gl.points.map((p) => `${p.x},${p.y}`).join(" ")} strokeWidth={sw} strokeLinejoin="round" />;
        if (gl.kind === "circle") return <circle key={i} cx={gl.cx} cy={gl.cy} r={gl.r} strokeWidth={sw} />;
        if (gl.kind === "rect") return <rect key={i} x={gl.x} y={gl.y} width={gl.w} height={gl.h} strokeWidth={sw} />;
        if (gl.kind === "lines")
          return (
            <g key={i}>
              {gl.lines.map((ln, j) => (
                <line key={j} x1={ln.x1} y1={ln.y1} x2={ln.x2} y2={ln.y2} strokeWidth={sw} />
              ))}
            </g>
          );
        return null;
      })}
      {g.allAround && <circle cx={g.allAround.cx} cy={g.allAround.cy} r={g.allAround.r} strokeWidth={sw} />}
      {g.campo && <polygon points={g.campo.points.map((p) => `${p.x},${p.y}`).join(" ")} fill={s.color} stroke="none" />}
      {s.size && (
        <text x={g.sizePos.x} y={g.sizePos.y} fontSize={fontSize} textAnchor={g.sizePos.anchor} fontFamily="'IBM Plex Mono',monospace" stroke="none" fill={s.color}>
          {s.size}
        </text>
      )}
      {s.tail && (
        <text x={g.tailPos.x} y={g.tailPos.y} dominantBaseline="middle" fontSize={fontSize} textAnchor={g.tailPos.anchor} fontFamily="'IBM Plex Mono',monospace" stroke="none" fill={s.color}>
          {s.tail}
        </text>
      )}
    </g>
  );
}

/* Versión estática (cadena SVG) de una cota automática, usada al exportar. */
function renderCotaDescriptorStatic(desc, color) {
  if (desc.kind === "leader") {
    return `<line x1="${desc.leader.from.x}" y1="${desc.leader.from.y}" x2="${desc.leader.to.x}" y2="${desc.leader.to.y}" stroke="${color}" stroke-width="0.4"/><text x="${desc.textPos.x}" y="${desc.textPos.y}" font-size="3.2" font-family="'IBM Plex Mono',monospace" fill="${color}" text-anchor="middle" dominant-baseline="middle">${escapeXml(desc.label)}</text>`;
  }
  if (desc.kind === "plain") {
    const rot = desc.rotDeg || 0;
    const transformAttr = rot ? ` transform="rotate(${rot} ${desc.textPos.x} ${desc.textPos.y})"` : "";
    return `<text x="${desc.textPos.x}" y="${desc.textPos.y}" font-size="3.2" font-family="'IBM Plex Mono',monospace" fill="${color}" text-anchor="middle" dominant-baseline="middle"${transformAttr}>${escapeXml(desc.label)}</text>`;
  }
  const fontSize = 3.2,
    tickLen = 2;
  const dLen = dist(desc.a, desc.bpt) || 1;
  const ux = (desc.bpt.x - desc.a.x) / dLen,
    uy = (desc.bpt.y - desc.a.y) / dLen;
  const m = mid(desc.a, desc.bpt);
  const gap = Math.max(desc.label.length * fontSize * 0.3, fontSize * 0.6) + 1;
  const gA = { x: m.x - ux * gap, y: m.y - uy * gap };
  const gB = { x: m.x + ux * gap, y: m.y + uy * gap };
  const tA = tickAt(desc.a, desc.dirDeg, tickLen);
  const tB = tickAt(desc.bpt, desc.dirDeg, tickLen);
  let out = "";
  desc.extLines.forEach((l) => {
    out += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="${color}" stroke-width="0.3" stroke-dasharray="1,1" opacity="0.55"/>`;
  });
  out += `<line x1="${desc.a.x}" y1="${desc.a.y}" x2="${gA.x}" y2="${gA.y}" stroke="${color}" stroke-width="0.35"/>`;
  out += `<line x1="${gB.x}" y1="${gB.y}" x2="${desc.bpt.x}" y2="${desc.bpt.y}" stroke="${color}" stroke-width="0.35"/>`;
  out += `<line x1="${tA.x1}" y1="${tA.y1}" x2="${tA.x2}" y2="${tA.y2}" stroke="${color}" stroke-width="0.4"/>`;
  out += `<line x1="${tB.x1}" y1="${tB.y1}" x2="${tB.x2}" y2="${tB.y2}" stroke="${color}" stroke-width="0.4"/>`;
  out += `<text x="${m.x}" y="${m.y}" font-size="${fontSize}" font-family="'IBM Plex Mono',monospace" fill="${color}" text-anchor="middle" dominant-baseline="middle">${escapeXml(desc.label)}</text>`;
  return out;
}

/* static (non-interactive) render used only for export */
function renderShapeStatic(s, unit = "mm") {
  const stroke = s.color;
  let measureSvg = "";
  if (MEASURABLE_TYPES.has(s.type) && s.showMeasure === true) {
    measureSvg = computeAutoCotas(s, unit, 6)
      .map((desc) => renderCotaDescriptorStatic(desc, stroke))
      .join("");
  }
  switch (s.type) {
    case "line":
      return `<line x1="${s.p1.x}" y1="${s.p1.y}" x2="${s.p2.x}" y2="${s.p2.y}" stroke="${stroke}" stroke-width="1" />${measureSvg}`;
    case "arrow":
      return `<line x1="${s.p1.x}" y1="${s.p1.y}" x2="${s.p2.x}" y2="${s.p2.y}" stroke="${stroke}" stroke-width="1.2" marker-end="url(#arrowend)" />${measureSvg}`;
    case "rect": {
      const x = Math.min(s.p1.x, s.p2.x),
        y = Math.min(s.p1.y, s.p2.y);
      const w = Math.abs(s.p2.x - s.p1.x),
        h = Math.abs(s.p2.y - s.p1.y);
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${stroke}" stroke-width="1" />${measureSvg}`;
    }
    case "profile": {
      const loops = profileOutline(s);
      return `<path d="${loopsToPathD(loops)}" fill="none" stroke="${stroke}" stroke-width="1" stroke-linejoin="round" transform="${profileTransform(s)}" />${measureSvg}`;
    }
    case "circle":
      return `<circle cx="${s.center.x}" cy="${s.center.y}" r="${s.radius}" fill="none" stroke="${stroke}" stroke-width="1" />${measureSvg}`;
    case "arc":
      return `<path d="${arcPath(s.center, s.radius, s.start, s.end)}" fill="none" stroke="${stroke}" stroke-width="1" />${measureSvg}`;
    case "polygon":
      return `<polygon points="${s.points.map((p) => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${stroke}" stroke-width="1" />${measureSvg}`;
    case "text":
      return `<text x="${s.pos.x}" y="${s.pos.y}" font-size="${s.size}" fill="${stroke}" font-family="sans-serif"${s.rotation ? ` transform="rotate(${s.rotation} ${s.pos.x} ${s.pos.y})"` : ""}>${escapeXml(s.text)}</text>`;
    case "dimension":
      return renderDimensionStatic(s, unit);
    case "weld":
      return renderWeldStatic(s);
    default:
      return "";
  }
}
function escapeXml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderDimensionStatic(s, unit) {
  const label = dimLabel(s, unit);
  const labelPos = dimLabelPos(s);
  const fontSize = 4;
  const tickLen = 2.2;
  const tickSvg = (p, dirDeg) => {
    const t = tickAt(p, dirDeg, tickLen);
    return `<line x1="${t.x1}" y1="${t.y1}" x2="${t.x2}" y2="${t.y2}" stroke="${s.color}" stroke-width="0.6"/>`;
  };
  let lines = "";
  let textX = labelPos.x,
    textY = labelPos.y - 1,
    dominant = false;
  if (s.kind === "angulo") {
    const a1 = angleOf(s.p1, s.p2);
    const a2 = angleOf(s.p1, s.p3);
    lines = `<line x1="${s.p1.x}" y1="${s.p1.y}" x2="${s.p2.x}" y2="${s.p2.y}" stroke="${s.color}" stroke-width="0.5" stroke-dasharray="2,2"/><line x1="${s.p1.x}" y1="${s.p1.y}" x2="${s.p3.x}" y2="${s.p3.y}" stroke="${s.color}" stroke-width="0.5" stroke-dasharray="2,2"/><path d="${arcPath(s.p1, 26, a1, a2)}" fill="none" stroke="${s.color}" stroke-width="0.5"/>`;
  } else if (s.kind === "horizontal" || s.kind === "vertical") {
    const isH = s.kind === "horizontal";
    const dimLine = isH ? Math.min(s.p1.y, s.p2.y) + s.offset : Math.max(s.p1.x, s.p2.x) + s.offset;
    const a = isH ? { x: s.p1.x, y: dimLine } : { x: dimLine, y: s.p1.y };
    const b = isH ? { x: s.p2.x, y: dimLine } : { x: dimLine, y: s.p2.y };
    const dirDeg = angleOf(a, b);
    const m = mid(a, b);
    const dLen = dist(a, b) || 1;
    const ux = (b.x - a.x) / dLen,
      uy = (b.y - a.y) / dLen;
    const gap = Math.max(label.length * fontSize * 0.3, fontSize * 0.6) + 1;
    const gA = { x: m.x - ux * gap, y: m.y - uy * gap };
    const gB = { x: m.x + ux * gap, y: m.y + uy * gap };
    lines = `<line x1="${s.p1.x}" y1="${s.p1.y}" x2="${a.x}" y2="${a.y}" stroke="${s.color}" stroke-width="0.3"/><line x1="${s.p2.x}" y1="${s.p2.y}" x2="${b.x}" y2="${b.y}" stroke="${s.color}" stroke-width="0.3"/><line x1="${a.x}" y1="${a.y}" x2="${gA.x}" y2="${gA.y}" stroke="${s.color}" stroke-width="0.4"/><line x1="${gB.x}" y1="${gB.y}" x2="${b.x}" y2="${b.y}" stroke="${s.color}" stroke-width="0.4"/>${tickSvg(a, dirDeg)}${tickSvg(b, dirDeg)}`;
    textX = m.x;
    textY = m.y;
    dominant = true;
  } else {
    const a = s.p1,
      b = s.p2;
    const dx = b.x - a.x,
      dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len,
      ny = dx / len;
    const off = s.offset;
    const a2 = { x: a.x + nx * off, y: a.y + ny * off };
    const b2 = { x: b.x + nx * off, y: b.y + ny * off };
    const dirDeg = angleOf(a2, b2);
    const m = mid(a2, b2);
    const dLen = dist(a2, b2) || 1;
    const ux = (b2.x - a2.x) / dLen,
      uy = (b2.y - a2.y) / dLen;
    const gap = Math.max(label.length * fontSize * 0.3, fontSize * 0.6) + 1;
    const gA = { x: m.x - ux * gap, y: m.y - uy * gap };
    const gB = { x: m.x + ux * gap, y: m.y + uy * gap };
    lines = `<line x1="${a.x}" y1="${a.y}" x2="${a2.x}" y2="${a2.y}" stroke="${s.color}" stroke-width="0.3"/><line x1="${b.x}" y1="${b.y}" x2="${b2.x}" y2="${b2.y}" stroke="${s.color}" stroke-width="0.3"/><line x1="${a2.x}" y1="${a2.y}" x2="${gA.x}" y2="${gA.y}" stroke="${s.color}" stroke-width="0.4"/><line x1="${gB.x}" y1="${gB.y}" x2="${b2.x}" y2="${b2.y}" stroke="${s.color}" stroke-width="0.4"/>${tickSvg(a2, dirDeg)}${tickSvg(b2, dirDeg)}`;
    textX = m.x;
    textY = m.y;
    dominant = true;
  }
  return `${lines}<text x="${textX}" y="${textY}" ${dominant ? 'dominant-baseline="middle" ' : ""}font-size="${fontSize}" text-anchor="middle" font-family="monospace" fill="${s.color}">${escapeXml(label)}</text>`;
}
function renderWeldStatic(s) {
  const g = weldGeom(s);
  const fontSize = 4;
  let glyphSvg = "";
  g.glyphs.forEach((gl) => {
    if (gl.kind === "polygon") glyphSvg += `<polygon points="${gl.points.map((p) => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="0.6" stroke-linejoin="round"/>`;
    else if (gl.kind === "circle") glyphSvg += `<circle cx="${gl.cx}" cy="${gl.cy}" r="${gl.r}" fill="none" stroke="${s.color}" stroke-width="0.6"/>`;
    else if (gl.kind === "rect") glyphSvg += `<rect x="${gl.x}" y="${gl.y}" width="${gl.w}" height="${gl.h}" fill="none" stroke="${s.color}" stroke-width="0.6"/>`;
    else if (gl.kind === "lines") gl.lines.forEach((ln) => (glyphSvg += `<line x1="${ln.x1}" y1="${ln.y1}" x2="${ln.x2}" y2="${ln.y2}" stroke="${s.color}" stroke-width="0.6"/>`));
  });
  const allAroundSvg = g.allAround ? `<circle cx="${g.allAround.cx}" cy="${g.allAround.cy}" r="${g.allAround.r}" fill="none" stroke="${s.color}" stroke-width="0.6"/>` : "";
  const campoSvg = g.campo ? `<polygon points="${g.campo.points.map((p) => `${p.x},${p.y}`).join(" ")}" fill="${s.color}" stroke="none"/>` : "";
  const sizeSvg = s.size ? `<text x="${g.sizePos.x}" y="${g.sizePos.y}" font-size="${fontSize}" text-anchor="${g.sizePos.anchor}" font-family="monospace" fill="${s.color}">${escapeXml(s.size)}</text>` : "";
  const tailSvg = s.tail ? `<text x="${g.tailPos.x}" y="${g.tailPos.y}" dominant-baseline="middle" font-size="${fontSize}" text-anchor="${g.tailPos.anchor}" font-family="monospace" fill="${s.color}">${escapeXml(s.tail)}</text>` : "";
  return `<line x1="${g.leader.x1}" y1="${g.leader.y1}" x2="${g.leader.x2}" y2="${g.leader.y2}" stroke="${s.color}" stroke-width="0.7" marker-end="url(#arrowend)"/><line x1="${g.ref.x1}" y1="${g.ref.y1}" x2="${g.ref.x2}" y2="${g.ref.y2}" stroke="${s.color}" stroke-width="0.7"/>${glyphSvg}${allAroundSvg}${campoSvg}${sizeSvg}${tailSvg}`;
}

function DraftPreview({ draft, color, scale }) {
  const sw = 1.4 / scale;
  const dash = `${3 / scale},${3 / scale}`;
  const pts = draft.points;
  const cur = draft.cursor;
  if (draft.tool === "line" || draft.tool === "arrow") {
    const p2 = snapAngleDeg(pts[0], cur);
    return <line x1={pts[0].x} y1={pts[0].y} x2={p2.x} y2={p2.y} stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "rect") {
    const x = Math.min(pts[0].x, cur.x),
      y = Math.min(pts[0].y, cur.y);
    return <rect x={x} y={y} width={Math.abs(cur.x - pts[0].x)} height={Math.abs(cur.y - pts[0].y)} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "perfil") {
    const loops = profileOutline({ p1: pts[0], p2: cur, profileType: draft.profileType || "angular", thickness: 5 });
    return <path d={loopsToPathD(loops)} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={dash} strokeLinejoin="round" />;
  }
  if (draft.tool === "circle") {
    return <circle cx={pts[0].x} cy={pts[0].y} r={dist(pts[0], cur)} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "arc") {
    if (pts.length === 1) return <line x1={pts[0].x} y1={pts[0].y} x2={cur.x} y2={cur.y} stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
    const radius = dist(pts[0], pts[1]);
    const start = angleOf(pts[0], pts[1]);
    const end = angleOf(pts[0], cur);
    return <path d={arcPath(pts[0], radius, start, end)} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "polygon") {
    return <polyline points={[...pts, cur].map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "cota") {
    return <line x1={pts[0].x} y1={pts[0].y} x2={cur.x} y2={cur.y} stroke={color} strokeWidth={sw} strokeDasharray={dash} />;
  }
  if (draft.tool === "weld") {
    return <line x1={pts[0].x} y1={pts[0].y} x2={cur.x} y2={cur.y} stroke={color} strokeWidth={sw} strokeDasharray={dash} markerEnd="url(#arrowend)" />;
  }
  return null;
}

/* Agranda/achica una figura manteniendo su centro fijo. factor > 1 agranda, < 1 achica. */
const SCALE_SUPPORTED_TYPES = new Set(["line", "arrow", "weld", "rect", "profile", "circle", "polygon", "text"]);
function scaleShapeAround(shape, factor) {
  switch (shape.type) {
    case "line":
    case "arrow":
    case "weld": {
      const cx = (shape.p1.x + shape.p2.x) / 2,
        cy = (shape.p1.y + shape.p2.y) / 2;
      const scalePt = (p) => ({ x: cx + (p.x - cx) * factor, y: cy + (p.y - cy) * factor });
      return { p1: scalePt(shape.p1), p2: scalePt(shape.p2) };
    }
    case "rect":
    case "profile": {
      const x = Math.min(shape.p1.x, shape.p2.x),
        y = Math.min(shape.p1.y, shape.p2.y);
      const w = Math.abs(shape.p2.x - shape.p1.x),
        h = Math.abs(shape.p2.y - shape.p1.y);
      const cx = x + w / 2,
        cy = y + h / 2;
      const nw = Math.max(w * factor, 4),
        nh = Math.max(h * factor, 4);
      return { p1: { x: cx - nw / 2, y: cy - nh / 2 }, p2: { x: cx + nw / 2, y: cy + nh / 2 } };
    }
    case "circle":
      return { radius: Math.max(shape.radius * factor, 2) };
    case "polygon": {
      const cx = shape.points.reduce((s, p) => s + p.x, 0) / shape.points.length;
      const cy = shape.points.reduce((s, p) => s + p.y, 0) / shape.points.length;
      return { points: shape.points.map((p) => ({ x: cx + (p.x - cx) * factor, y: cy + (p.y - cy) * factor })) };
    }
    case "text":
      return { size: Math.max((shape.size || 14) * factor, 4) };
    default:
      return {};
  }
}

          </label>
          <NumField label="Ancho" value={Math.abs(shape.p2.x - shape.p1.x)} unit={unit} onCommit={(mm) => onChange({ p2: { ...shape.p2, x: shape.p1.x + Math.sign(shape.p2.x - shape.p1.x || 1) * mm } })} />
          <NumField label="Alto" value={Math.abs(shape.p2.y - shape.p1.y)} unit={unit} onCommit={(mm) => onChange({ p2: { ...shape.p2, y: shape.p1.y + Math.sign(shape.p2.y - shape.p1.y || 1) * mm } })} />
          {PROFILE_NEEDS_THICKNESS.has(shape.profileType) && <NumField label="Espesor" value={shape.thickness || 5} unit={unit} onCommit={(mm) => onChange({ thickness: mm })} />}
          <NumField label="Posición X" value={Math.min(shape.p1.x, shape.p2.x)} unit={unit} onCommit={(mm) => shiftShapeTo(shape, mm, null, onChange)} />
          <NumField label="Posición Y" value={Math.min(shape.p1.y, shape.p2.y)} unit={unit} onCommit={(mm) => shiftShapeTo(shape, null, mm, onChange)} />
          <label>Orientación</label>
          <div className="ws-propactions">
            <button onClick={() => onChange({ rotation: ((shape.rotation || 0) + 90) % 360 })} title="Girar 90°">
              ⟳ Rotar 90°
            </button>
          </div>
          <div className="ws-propactions">
            <button className={shape.mirror ? "primary" : ""} onClick={() => onChange({ mirror: !shape.mirror })} title="Espejo horizontal">
              ↔ Voltear horizontal
            </button>
            <button className={shape.mirrorV ? "primary" : ""} onClick={() => onChange({ mirrorV: !shape.mirrorV })} title="Espejo vertical">
              ↕ Voltear vertical
            </button>
          </div>
        </>
      )}
      {shape.type === "circle" && <NumField label="Radio" value={shape.radius} unit={unit} onCommit={(mm) => onChange({ radius: mm })} />}
      {shape.type === "text" && (
        <>
          <label>
            Contenido
            <input className="ws-textprop" value={shape.text} onChange={(e) => onChange({ text: e.target.value })} />
          </label>
          <NumField label="Tamaño" value={shape.size} unit="mm" onCommit={(mm) => onChange({ size: mm })} />
          <NumField label="Rotación (°)" value={shape.rotation || 0} unit="" isDeg onCommit={(v) => onChange({ rotation: v })} />
        </>
      )}
      {shape.type === "dimension" && (
        <>
          <div className="ws-hint">Tipo: {shape.kind}</div>
          <div className="ws-hint">Valor: {shape.overrideText || dimLabel(shape, unit)}</div>
          {shape.kind !== "angulo" && (
            <label>
              Unidad de esta cota
              <select value={shape.unit || ""} onChange={(e) => onChange({ unit: e.target.value })}>
                <option value="">Usar unidad del plano ({UNIT_LABEL[unit]})</option>
                {Object.keys(UNIT_LABEL).map((u) => (
                  <option key={u} value={u}>
                    {UNIT_LABEL[u]}
                  </option>
                ))}
              </select>
            </label>
          )}
          <label>
            Sobrescribir valor
            <input className="ws-textprop" value={shape.overrideText || ""} placeholder={dimLabel(shape, unit)} onChange={(e) => onChange({ overrideText: e.target.value })} />
          </label>
        </>
      )}
      {shape.type === "weld" && (
        <>
          <label>
            Tipo de soldadura
            <select value={shape.weldType} onChange={(e) => onChange({ weldType: e.target.value })}>
              {WELD_TYPES.map((w) => (
                <option key={w.id} value={w.id}>
                  {w.label}
                </option>
              ))}
            </select>
          </label>
          <label>
            Lado del símbolo
            <select value={shape.side} onChange={(e) => onChange({ side: e.target.value })}>
              {WELD_SIDES.map((w) => (
                <option key={w.id} value={w.id}>
                  {w.label}
                </option>
              ))}
            </select>
          </label>
          <label>
            Tamaño / cateto
            <input className="ws-textprop" value={shape.size || ""} placeholder="p. ej. 5" onChange={(e) => onChange({ size: e.target.value })} />
          </label>
          <NumField label="Longitud de línea" value={shape.length || 40} unit={unit} onCommit={(mm) => onChange({ length: mm })} />
          <label>
            Nota / proceso (cola)
            <input className="ws-textprop" value={shape.tail || ""} placeholder="p. ej. SMAW" onChange={(e) => onChange({ tail: e.target.value })} />
          </label>
          <label className="ws-check">
            <input type="checkbox" checked={!!shape.allAround} onChange={(e) => onChange({ allAround: e.target.checked })} />
            Todo alrededor
          </label>
          <label className="ws-check">
            <input type="checkbox" checked={!!shape.campo} onChange={(e) => onChange({ campo: e.target.checked })} />
            Soldadura de campo
          </label>
        </>
      )}
      <label>
        Color
        <div className="ws-colors">
          {PALETTE.map((c) => (
            <button key={c.id} className={`ws-swatch ${shape.color === c.hex ? "on" : ""}`} style={{ background: c.hex }} onClick={() => setColor(c.hex)} />
          ))}
        </div>
      </label>
      <div className="ws-propactions">
        <button onClick={onDuplicate}>Duplicar (Ctrl+D)</button>
        <button className="danger" onClick={onDelete}>
          Eliminar
        </button>
      </div>
    </div>
  );
}
function shiftShapeTo(shape, newX, newY, onChange) {
  const curMinX = Math.min(shape.p1.x, shape.p2.x);
  const curMinY = Math.min(shape.p1.y, shape.p2.y);
  const dx = newX !== null ? newX - curMinX : 0;
  const dy = newY !== null ? newY - curMinY : 0;
  onChange({ p1: { x: shape.p1.x + dx, y: shape.p1.y + dy }, p2: { x: shape.p2.x + dx, y: shape.p2.y + dy } });
}
function typeLabelEs(t) {
  return { line: "Línea", rect: "Rectángulo", circle: "Círculo", arc: "Arco", polygon: "Polígono", profile: "Perfil", text: "Texto", arrow: "Flecha", dimension: "Cota", weld: "Símbolo de soldadura" }[t] || t;
}

function NumField({ label, value, unit, onCommit, isDeg }) {
  const [local, setLocal] = useState(isDeg ? round(value, 1) : toDisplay(value, unit));
  useEffect(() => setLocal(isDeg ? round(value, 1) : toDisplay(value, unit)), [value, unit]); // eslint-disable-line
  return (
    <label>
      {label} {isDeg ? "" : `(${UNIT_LABEL[unit]})`}
      <input
        type="number"
        className="ws-numinput"
        value={local}
        onChange={(e) => setLocal(e.target.value)}
        onBlur={() => {
          const v = parseFloat(local);
          if (!isNaN(v)) onCommit(isDeg ? v : v * UNIT_FACTORS[unit]);
        }}
        onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
      />
    </label>
  );
}

function Modal({ title, children, onClose }) {
  return (
    <div className="ws-modalbg" onClick={onClose}>
      <div className="ws-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ws-modalhead">
          <h3>{title}</h3>
          <button onClick={onClose}>✕</button>
        </div>
        <div className="ws-modalbody">{children}</div>
      </div>
    </div>
  );
}
function SaveModal({ defaultName, onCancel, onConfirm }) {
  const [name, setName] = useState(defaultName || "Boceto sin título");
  return (
    <Modal title="Guardar boceto" onClose={onCancel}>
      <input autoFocus className="ws-textprop" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onConfirm(name)} />
      <div className="ws-propactions">
        <button onClick={onCancel}>Cancelar</button>
        <button className="primary" onClick={() => onConfirm(name)}>
          Guardar
        </button>
      </div>
    </Modal>
  );
}
